version: '3.8'

services:
  # 1. Mission Control Dashboard & Studio Web Platform
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @presence/web start
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: always

  # 2. OpenAPI 3.1 REST API & Interactive Scalar Docs Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @presence/api start
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  # 3. Canva Extension Integration Backend Server
  canva-extension:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @presence/canva-extension start
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
    restart: always
