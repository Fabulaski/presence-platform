version: '3.8'

services:
  presence-db:
    image: postgres:16-alpine
    container_name: presence-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: presence_password
      POSTGRES_DB: presence_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  presence-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presence-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:presence_password@presence-db:5432/presence_db?schema=public"
    ports:
      - '3001:3001'
    depends_on:
      presence-db:
        condition: service_healthy

volumes:
  postgres_data:
